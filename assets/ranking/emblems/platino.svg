<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="platGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#003B46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="platPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FBFC"/>
      <stop offset="30%" stop-color="#98D8E3"/>
      <stop offset="70%" stop-color="#469CA8"/>
      <stop offset="100%" stop-color="#1D535C"/>
    </linearGradient>
    <linearGradient id="platBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0B3C44"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#platGlow)"/>
  <!-- Crystalline Side Wings -->
  <polygon points="10,65 55,30 65,75 25,115" fill="#469CA8" stroke="#E0FBFC" stroke-width="2"/>
  <polygon points="190,65 145,30 135,75 175,115" fill="#469CA8" stroke="#E0FBFC" stroke-width="2"/>
  <polygon points="25,115 65,75 55,135" fill="#1D535C" stroke="#98D8E3" stroke-width="1.5"/>
  <polygon points="175,115 135,75 145,135" fill="#1D535C" stroke="#98D8E3" stroke-width="1.5"/>
  <!-- Main Shield -->
  <polygon points="100,10 170,55 152,150 100,192 48,150 30,55" fill="url(#platPlate)" stroke="url(#platBorder)" stroke-width="6"/>
  <!-- Inner Crystal Core -->
  <polygon points="100,32 150,65 136,138 100,174 64,138 50,65" fill="#06252B" stroke="#00E5FF" stroke-width="3"/>
  <!-- Platinum Shard -->
  <polygon points="100,45 125,85 155,95 125,120 130,155 100,135 70,155 75,120 45,95 75,85" fill="url(#platPlate)" stroke="#FFF" stroke-width="2"/>
  <polygon points="100,80 120,105 100,130 80,105" fill="#E0FBFC" stroke="#00E5FF" stroke-width="2"/>
  <circle cx="100" cy="105" r="7" fill="#FFFFFF"/>
</svg>