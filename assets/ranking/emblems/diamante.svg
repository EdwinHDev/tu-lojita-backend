<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="diamondGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40C4FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7C4DFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#001026" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamondPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE"/>
      <stop offset="30%" stop-color="#80D8FF"/>
      <stop offset="65%" stop-color="#40C4FF"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
    <linearGradient id="diamondBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#80D8FF"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#diamondGlow)"/>
  <!-- Prismatic Side Wings -->
  <polygon points="5,55 50,20 70,65 15,115" fill="#0288D1" stroke="#E1F5FE" stroke-width="2"/>
  <polygon points="195,55 150,20 130,65 185,115" fill="#0288D1" stroke="#E1F5FE" stroke-width="2"/>
  <!-- Top Crown Spikes -->
  <polygon points="100,2 118,25 100,32 82,25" fill="#E1F5FE" stroke="#FFF" stroke-width="2"/>
  <polygon points="70,18 85,35 68,40 55,25" fill="#80D8FF" stroke="#FFF" stroke-width="1.5"/>
  <polygon points="130,18 145,25 132,40 115,35" fill="#80D8FF" stroke="#FFF" stroke-width="1.5"/>
  <!-- Main Shield -->
  <polygon points="100,18 175,55 155,155 100,196 45,155 25,55" fill="url(#diamondPlate)" stroke="url(#diamondBorder)" stroke-width="6"/>
  <!-- Inner Celestial Void -->
  <polygon points="100,36 152,68 138,142 100,178 62,142 48,68" fill="#0B132B" stroke="#80D8FF" stroke-width="3"/>
  <!-- Radiant Diamond Center -->
  <polygon points="100,50 135,85 100,155 65,85" fill="#80D8FF" stroke="#FFFFFF" stroke-width="3"/>
  <polygon points="100,65 120,90 100,135 80,90" fill="#E1F5FE" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="100,75 110,90 100,115 90,90" fill="#FFFFFF"/>
</svg>