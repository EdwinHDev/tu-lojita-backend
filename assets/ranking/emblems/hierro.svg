<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="ironGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#71797E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1B1E23" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ironPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A6268"/>
      <stop offset="50%" stop-color="#343A40"/>
      <stop offset="100%" stop-color="#212529"/>
    </linearGradient>
    <linearGradient id="ironBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#868E96"/>
      <stop offset="100%" stop-color="#212529"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#ironGlow)"/>
  <!-- Base Shield -->
  <polygon points="100,20 165,55 150,140 100,180 50,140 35,55" fill="url(#ironPlate)" stroke="url(#ironBorder)" stroke-width="6"/>
  <!-- Inner Rim -->
  <polygon points="100,35 150,65 138,130 100,165 62,130 50,65" fill="#2B3035" stroke="#495057" stroke-width="3"/>
  <!-- Iron Cross / Wings -->
  <path d="M100,50 L115,85 L145,95 L115,115 L120,150 L100,135 L80,150 L85,115 L55,95 L85,85 Z" fill="#495057" stroke="#ADB5BD" stroke-width="2"/>
  <!-- Center Rivet Gem -->
  <circle cx="100" cy="105" r="14" fill="#6C757D" stroke="#CED4DA" stroke-width="3"/>
  <circle cx="100" cy="105" r="7" fill="#ADB5BD"/>
  <!-- Rivets -->
  <circle cx="55" cy="65" r="3" fill="#CED4DA"/>
  <circle cx="145" cy="65" r="3" fill="#CED4DA"/>
  <circle cx="65" cy="130" r="3" fill="#CED4DA"/>
  <circle cx="135" cy="130" r="3" fill="#CED4DA"/>
</svg>